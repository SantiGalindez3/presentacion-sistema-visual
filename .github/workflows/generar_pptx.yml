name: Generar Presentacion PowerPoint

on:
  push:
    branches: [ "main" ]
  workflow_dispatch: # Esto agrega un botón para ejecutarlo manualmente

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout del codigo
      uses: actions/checkout@v4

    - name: Configurar Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Instalar dependencias
      run: |
        python -m pip install --upgrade pip
        pip install python-pptx PyPDF2

    - name: Ejecutar script para crear PPTX
      run: python crear_presentacion.py

    - name: Subir el archivo PPTX como artefacto
      uses: actions/upload-artifact@v4
      with:
        name: Presentacion-Sistema-Visual
        path: Presentacion_Final_Sistema_Visual.pptx
